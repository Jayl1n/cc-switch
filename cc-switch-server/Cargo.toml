[package]
name = "cc-switch-server"
version = "0.1.0"
description = "Standalone headless server for CC Switch core — embeddable proxy for AI coding tools"
authors = ["CC Switch Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.85.0"

[[bin]]
name = "cc-switch-server"
path = "src/main.rs"

[dependencies]
cc-switch-core = { path = "../cc-switch-core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
# ── mgmt API（/api/v1/）──
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
anyhow = "1.0"
thiserror = "2.0"

[target.'cfg(target_os = "linux")'.dependencies]
# CI 用 cross 容器交叉编译 Linux ARM64 时，容器缺 target 架构的 libssl-dev，
# 用 vendored feature 让 openssl-sys 从源码静态编译，免系统 pkg-config 依赖。
# (feature unification 会把 vendored 传递给 reqwest native-tls 的 openssl-sys)
openssl-sys = { version = "0.9", features = ["vendored"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
serial_test = "3"
