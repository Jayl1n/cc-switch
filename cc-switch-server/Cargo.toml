[package]
name = "cc-switch-server"
version = "0.1.0"
description = "Standalone headless server for CC Switch core — embeddable proxy for AI coding tools"
authors = ["CC Switch Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.85.0"

[[bin]]
name = "cc-switch-server"
path = "src/main.rs"

[dependencies]
cc-switch-core = { path = "../cc-switch-core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
